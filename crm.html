<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EQX Labs | Agency Project Operations Suite</title>
  <meta name="description" content="Revolutionary Project Management Suite for Music Production, Digital Engineering, Live Sound, DJ Gigs, and Marketing." />
  <link rel="stylesheet" href="css/crm.css?v=1100" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>

  <!-- Fullscreen Dashboard Layout -->
  <div class="crm-window">

    <!-- Sidebar Navigation (Dribbble Shot Matched) -->
    <aside class="crm-sidebar">
      <div>
        <!-- Workspace Selector Header -->
        <div class="crm-brand-selector">
          <div class="crm-brand-logo-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <div style="flex: 1;">
            <div class="crm-brand-name">EQX Agency</div>
            <div class="crm-brand-sub">Creative Agency</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
        </div>

        <!-- Updates Notification Link -->
        <button class="crm-nav-link crm-updates-link" onclick="alert('Viewing 2 New Project Notifications')">
          <div style="display: flex; align-items: center; gap: 14px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Updates</span>
          </div>
          <span class="crm-badge-red">2</span>
        </button>

        <div class="crm-divider"></div>

        <!-- Main Navigation Links corresponding to Sidebar -->
        <nav class="crm-nav-group">
          <button class="crm-nav-link active" id="nav-link-dashboard" onclick="window.navigateToView('dashboard')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
          </button>

          <button class="crm-nav-link" id="nav-link-calendar" onclick="window.navigateToView('calendar')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Calendar</span>
          </button>

          <button class="crm-nav-link" id="nav-link-tasks" onclick="window.navigateToView('tasks')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>My Tasks</span>
          </button>

          <button class="crm-nav-link" id="nav-link-projects" onclick="window.navigateToView('projects')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Projects</span>
          </button>

          <button class="crm-nav-link" id="nav-link-teams" onclick="window.navigateToView('teams')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Teams</span>
          </button>

          <button class="crm-nav-link" id="nav-link-leads" onclick="window.navigateToView('leads')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            <span>Leads</span>
          </button>

          <button class="crm-nav-link" id="nav-link-clients" onclick="window.navigateToView('clients')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Clients</span>
          </button>

          <button class="crm-nav-link" id="nav-link-invoices" onclick="window.navigateToView('invoices')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>Invoices</span>
          </button>

          <button class="crm-nav-link" id="nav-link-documents" onclick="window.navigateToView('documents')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Documents</span>
          </button>
        </nav>

        <!-- Favourite Section -->
        <div class="crm-nav-section-label" style="margin-top: 16px;">FAVOURITE</div>
        <div class="crm-fav-group">
          <button class="crm-nav-link" onclick="window.navigateToView('projects'); window.filterByCategory('digital');">
            <span style="font-size: 16px;">🥊</span> <span>Filllo Website</span>
          </button>
          <button class="crm-nav-link" onclick="window.navigateToView('tasks');">
            <span style="font-size: 16px;">🌍</span> <span>Portfolio Tasks</span>
          </button>
        </div>
      </div>

      <!-- Bottom Settings & Support Section -->
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #E2E8F0;">
        <button class="crm-nav-link" id="nav-link-settings" onclick="window.navigateToView('settings')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
        <button class="crm-nav-link" id="nav-link-support" onclick="window.navigateToView('support')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          <span>Support</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="crm-workspace">
      <!-- Dynamically populated by JS SPA View Router -->
    </main>

  </div>

  <!-- New Project Creation Modal -->
  <div class="crm-modal-overlay" id="crm-new-project-modal">
    <div class="crm-modal-card">
      <button class="crm-modal-close" onclick="window.closeNewProjectModal()">&times;</button>
      
      <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--crm-cyan); font-weight: 700; margin-bottom: 4px;">
        EQX Operations
      </div>
      <h3 style="font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; color: var(--crm-text-bright); margin-bottom: 20px;">
        Initialize New Agency Project
      </h3>

      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--crm-text-bright); margin-bottom: 6px;">Project Title</label>
          <input type="text" id="new-proj-title" placeholder="e.g. Stem Mixing & Mastering EP" style="width: 100%; background: #0B1120; border: 1px solid var(--crm-border); color: var(--crm-text-bright); padding: 12px; border-radius: 10px; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--crm-text-bright); margin-bottom: 6px;">Client Name / Organization</label>
          <input type="text" id="new-proj-client" placeholder="e.g. Nordic Creative Hub" style="width: 100%; background: #0B1120; border: 1px solid var(--crm-border); color: var(--crm-text-bright); padding: 12px; border-radius: 10px; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--crm-text-bright); margin-bottom: 6px;">Service Category</label>
          <select id="new-proj-cat" style="width: 100%; background: #0B1120; border: 1px solid var(--crm-border); color: var(--crm-text-bright); padding: 12px; border-radius: 10px; outline: none;">
            <option value="recording">🎙️ Recording & Tracking</option>
            <option value="production">🎵 Music Production</option>
            <option value="digital">💻 Digital Engineering</option>
            <option value="dj-gig">🎧 DJ Gig & Set</option>
            <option value="live-sound">🎛️ Live Sound Eng.</option>
            <option value="marketing">📢 Marketing Campaign</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--crm-text-bright); margin-bottom: 6px;">Project Value (SEK)</label>
          <input type="number" id="new-proj-val" placeholder="e.g. 25000" style="width: 100%; background: #0B1120; border: 1px solid var(--crm-border); color: var(--crm-text-bright); padding: 12px; border-radius: 10px; outline: none;" />
        </div>

        <button type="button" onclick="window.saveNewProject()" style="margin-top: 10px; background: var(--crm-cyan); color: #000; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-size: 0.95rem;">
          Create & Initialize Deliverable Tasks
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Module Controller -->
  <script type="module" src="js/crm/app.js?v=1100"></script>
</body>
</html>
