<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQX — Scroll Hero</title>
<style>
  :root {
    --bg: #0a0d10;
    --ink: #f5f2ec;
    --accent: #f07f1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero scroll track ─────────────────────────────── */
  .hero-track { height: 420vh; position: relative; }
  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  .hero-sticky canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Overlay copy ──────────────────────────────────── */
  .hero-copy {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 6vw, 80px);
    pointer-events: none;
  }
  .phase {
    position: absolute;
    left: clamp(24px, 6vw, 80px);
    bottom: clamp(24px, 8vh, 96px);
    max-width: 34ch;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .phase.on { opacity: 1; transform: translateY(0); }
  .phase .kicker {
    display: block;
    font-size: 13px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .phase h1, .phase h2 {
    font-size: clamp(32px, 5.4vw, 64px);
    font-weight: 650;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .phase.dark-text h2, .phase.dark-text h1 { color: #14181c; }
  .phase.dark-text .kicker { color: #d96f0f; }

  /* ── Scroll hint ───────────────────────────────────── */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
    opacity: .7;
    transition: opacity .4s ease;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .hint.off { opacity: 0; animation: none; }
  @keyframes pulse { 50% { transform: translate(-50%, 6px); } }

  /* ── Section after the hero (placeholder) ──────────── */
  .next {
    min-height: 100vh;
    background: #f5f2ec;
    color: #14181c;
    display: flex;
    align-items: center;
    padding: clamp(24px, 6vw, 80px);
  }
  .next .inner { max-width: 640px; }
  .next h3 { font-size: clamp(24px, 3vw, 40px); margin-bottom: 16px; letter-spacing: -0.02em; }
  .next p { font-size: 18px; line-height: 1.6; opacity: .85; }

  @media (prefers-reduced-motion: reduce) {
    .hero-track { height: 100vh; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<section class="hero-track" id="heroTrack">
  <div class="hero-sticky">
    <canvas id="heroCanvas"></canvas>

    <div class="hero-copy">
      <div class="phase" data-from="0.00" data-to="0.30">
        <span class="kicker">EQX</span>
        <h1>Every space starts as an idea.</h1>
      </div>
      <div class="phase dark-text" data-from="0.30" data-to="0.68">
        <span class="kicker">The Blueprint</span>
        <h2>Designed for sound, down to the last wall.</h2>
      </div>
      <div class="phase dark-text" data-from="0.68" data-to="1.01">
        <span class="kicker">The Studio</span>
        <h2>Welcome to EQX.</h2>
      </div>
    </div>

    <div class="hint" id="hint">Scroll</div>
  </div>
</section>

<section class="next">
  <div class="inner">
    <h3>Your next section starts here.</h3>
    <p>Replace this block with your own content. The hero above hands off cleanly to the rest of the page.</p>
  </div>
</section>

<script>
(function () {
  var FRAME_COUNT = 96;
  var FRAME_PATH = function (i) {
    return 'frames/f' + String(i + 1).padStart(3, '0') + '.webp';
  };

  var canvas = document.getElementById('heroCanvas');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  var track = document.getElementById('heroTrack');
  var hint = document.getElementById('hint');
  var phases = Array.prototype.slice.call(document.querySelectorAll('.phase'));

  var images = new Array(FRAME_COUNT);
  var loaded = new Array(FRAME_COUNT).fill(false);
  var currentFrame = 0;

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    draw(currentFrame);
  }

  // Cover-fit draw
  function draw(i) {
    var img = images[i];
    if (!img || !loaded[i]) {
      // fall back to nearest loaded frame
      for (var d = 1; d < FRAME_COUNT; d++) {
        if (loaded[i - d]) { img = images[i - d]; break; }
        if (loaded[i + d]) { img = images[i + d]; break; }
      }
      if (!img) return;
    }
    var cw = canvas.width, ch = canvas.height;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var scale = Math.max(cw / iw, ch / ih);
    var w = iw * scale, h = ih * scale;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function loadFrame(i, cb) {
    if (images[i]) return;
    var img = new Image();
    img.decoding = 'async';
    img.onload = function () { loaded[i] = true; if (cb) cb(i); };
    img.src = FRAME_PATH(i);
    images[i] = img;
  }

  // Load strategy: first frame now, then key frames, then everything.
  loadFrame(0, function () { resize(); });
  [24, 48, 72, 95].forEach(function (i) { loadFrame(i); });
  var idle = window.requestIdleCallback || function (fn) { setTimeout(fn, 120); };
  idle(function () {
    for (var i = 0; i < FRAME_COUNT; i++) loadFrame(i, function (j) {
      if (j === currentFrame) draw(j);
    });
  });

  function progress() {
    var rect = track.getBoundingClientRect();
    var total = rect.height - window.innerHeight;
    if (total <= 0) return 1;
    return Math.min(1, Math.max(0, -rect.top / total));
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var p = progress();
      var frame = Math.min(FRAME_COUNT - 1, Math.round(p * (FRAME_COUNT - 1)));
      if (frame !== currentFrame) {
        currentFrame = frame;
        draw(frame);
      }
      phases.forEach(function (el) {
        var from = parseFloat(el.dataset.from), to = parseFloat(el.dataset.to);
        el.classList.toggle('on', p >= from && p < to);
      });
      hint.classList.toggle('off', p > 0.04);
    });
  }

  if (reduced) {
    // No scrubbing: show the finished studio, final copy.
    loadFrame(FRAME_COUNT - 1, function () { currentFrame = FRAME_COUNT - 1; draw(currentFrame); });
    phases[phases.length - 1].classList.add('on');
  } else {
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
  window.addEventListener('resize', resize);
  resize();
})();
</script>

</body>
</html>
